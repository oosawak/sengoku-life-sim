<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>奥羽一生録 ― 戦国の誰かに生まれて、一生を生きる【試作】</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <!-- 表紙 -->
  <section id="screen-title" class="screen">
    <p class="kicker">試作 v0.2 ／ 人物5人・出来事16件</p>
    <h1>奥羽<br>一生録</h1>
    <p class="sub">おうう・いっしょうろく</p>
    <p class="lead">天が決めた戦国人物に生まれ、<br>史実の出来事と選択の中で一生を生きる。<br>舞台は宮城・山形・福島。</p>
    <button id="btn-born" class="primary">生まれる</button>
    <button id="btn-collection" class="ghost">前世の記録（コレクション）</button>
    <div id="collection-panel" class="panel hidden"></div>
    <div class="settings-row">
      <label for="setting-event-frequency">日常の出来事（第2弾）の頻度</label>
      <select id="setting-event-frequency">
        <option value="few">少ない</option>
        <option value="normal">ふつう</option>
        <option value="many">多い</option>
      </select>
    </div>
    <p class="note">記録はこの端末の中だけに保存されます。公開はまだしていません。</p>
  </section>

  <!-- 出生札 -->
  <section id="screen-birth" class="screen hidden">
    <p class="kicker">天命</p>
    <div id="birth-card" class="card"></div>
    <button id="btn-start-life" class="primary">この一生を始める</button>
    <button id="btn-reroll" class="ghost">もう一度、生まれる</button>
  </section>

  <!-- 生涯 -->
  <section id="screen-life" class="screen life-screen hidden">
    <header class="life-head">
      <div>
        <div id="life-name" class="life-name"></div>
        <div id="life-meta" class="life-meta"></div>
      </div>
      <div class="life-nums">
        <div>史実の没年 <span id="life-historical-death"></span></div>
      </div>
    </header>
    <section class="life-hud" aria-label="現在の身上">
      <div id="life-stats" class="life-stats"></div>
      <div class="hud-meta">
        <span>評判 <b id="life-reputation">0</b></span>
        <span>所持金 <b><span id="life-money">0.0</span>貫</b></span>
        <span>健康 <b id="life-health">健やか</b></span>
      </div>
    </section>
    <div class="life-controls">
      <label class="focus-picker" for="life-focus">日々の心がけ
        <select id="life-focus">
          <option>武芸稽古</option><option>学問</option><option>政務</option>
          <option>人付き合い</option><option>家の仕事・商い</option><option>休養</option>
        </select>
      </label>
      <button id="btn-pause" class="ghost small">止める</button>
      <button id="btn-speed" class="ghost small">×1</button>
    </div>
    <div id="change-toast" class="change-toast" aria-live="polite"></div>
    <div id="event-box" class="event hidden"></div>
    <section class="log-panel" aria-label="一生の記録">
      <div class="log-heading">
        <h2>一生の記録</h2>
        <span>新しい記録は下に加わります</span>
      </div>
      <div id="life-log" class="log" role="region" aria-label="一生の記録。欄内をスクロールできます" tabindex="0"></div>
    </section>
  </section>

  <!-- 最期・列伝 -->
  <section id="screen-end" class="screen hidden">
    <p class="kicker">最期と列伝</p>
    <div id="end-summary" class="card"></div>
    <h2>列伝</h2>
    <div id="retsuden" class="retsuden"></div>
    <button id="btn-copy" class="primary">列伝をコピーする</button>
    <button id="btn-again" class="ghost">もう一度、生まれる</button>
    <button id="btn-to-title" class="ghost">表紙へ戻る</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
